server.port=8083
spring.application.name=restaurant-service
spring.data.mongodb.uri=mongodb://localhost:27017/restaurantdb

# kafka serializers (producers):
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
#spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# kafka serializers (consumer):
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
#spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=mukul.contracts.events

#Avro serializers:
spring.kafka.producer.value-serializer= io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.consumer.value-deserializer= io.confluent.kafka.serializers.KafkaAvroDeserializer

#Kafka schema-registry:
spring.kafka.properties.schema.registry.url=http://localhost:9090