server.port=8080
spring.application.name=api-gateway

# GATEWAY ROUTES

# Auth + User
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://localhost:8085
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**,/api/v1/auth,/api/v1/user/**,/api/v1/user
spring.cloud.gateway.routes[0].filters[0]=AuthenticationFilter

# Restaurant
spring.cloud.gateway.routes[1].id=restaurant-service
spring.cloud.gateway.routes[1].uri=http://localhost:8083
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/restaurant/**,/api/v1/restaurant,/api/v1/fooditem/**,/api/v1/fooditem
spring.cloud.gateway.routes[1].filters[0]=AuthenticationFilter

# Order + Cart
spring.cloud.gateway.routes[2].id=order-service
spring.cloud.gateway.routes[2].uri=http://localhost:8082
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/order/**,/api/v1/order,/api/v1/cart/**,/api/v1/cart
spring.cloud.gateway.routes[2].filters[0]=AuthenticationFilter

# Payment
spring.cloud.gateway.routes[3].id=payment-service
spring.cloud.gateway.routes[3].uri=http://localhost:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/payments/**,/api/v1/payments,/api/v1/payment/**,/api/v1/payment
spring.cloud.gateway.routes[3].filters[0]=AuthenticationFilter

# Delivery
spring.cloud.gateway.routes[4].id=delivery-service
spring.cloud.gateway.routes[4].uri=http://localhost:8086
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/delivery/**,/api/v1/delivery
spring.cloud.gateway.routes[4].filters[0]=AuthenticationFilter

# ==========================
# Global CORS Configuration
# ==========================

spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true