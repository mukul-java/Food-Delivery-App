databaseChangeLog:
  - changeSet:
      id: 2
      author: mukul

      changes:
        - createTable:
            tableName: order_items

            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_order_items
                    nullable: false

              - column:
                  name: order_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false

              - column:
                  name: food_item_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: food_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: price
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: order_items
            baseColumnNames: order_id
            constraintName: fk_order_items_order
            referencedTableName: orders
            referencedColumnNames: id
            onDelete: CASCADE

        - createIndex:
            tableName: order_items
            indexName: idx_order_items_order
            columns:
              - column:
                  name: order_id

        - createIndex:
            tableName: order_items
            indexName: idx_order_items_food
            columns:
              - column:
                  name: food_item_id